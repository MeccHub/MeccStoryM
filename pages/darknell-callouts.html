<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darknell Callouts - MeccStoryM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  .dk-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .dk-attacks { display: flex; flex-wrap: wrap; gap: 6px; }
  .dk-btn {
    font: 800 15px "Nunito", sans-serif; padding: 10px 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--msm-field-line); background: var(--msm-field); color: var(--msm-ink);
  }
  .dk-btn.on { border-color: #8b5cf6; box-shadow: inset 0 0 0 1px #8b5cf6; }
  .dk-attacks .dk-btn { min-width: 72px; text-transform: capitalize; }
  .dk-attacks .dk-btn.now { background: #8b5cf6; color: #fff; }
  .dk-attacks .dk-btn.next { border-color: #f59e0b; box-shadow: inset 0 0 0 2px #f59e0b; }
  .dk-phase { display: flex; gap: 10px; align-items: center; padding: 10px; }
  .dk-phase > b { font-family: "Fredoka One", sans-serif; font-size: 18px; color: var(--msm-ink); }
  .dk-stop { margin-top: 8px; background: #dc2626; color: #fff; border-color: #dc2626; }
  .dk-attacks .dk-btn { touch-action: manipulation; }
  @media (max-width: 700px) {
    .dk-grid { gap: 6px; }
    .dk-phase { padding: 6px; gap: 6px; }
    .dk-attacks { gap: 4px; }
    .dk-attacks .dk-btn { min-width: 0; flex: 1 1 52px; padding: 7px 4px; font-size: 13px; }
  }
  .dk-bar { height: 14px; margin-top: 8px; border-radius: 999px; background: var(--msm-soft); overflow: hidden; }
  .dk-bar i { display: block; height: 100%; width: 0; background: #8b5cf6; }
  .dk-attacks .dk-btn { position: relative; overflow: hidden; isolation: isolate; }
  .dk-fill { position: absolute; inset: 0 auto 0 0; width: 0; z-index: -1; background: #8b5cf6; opacity: .45; }
  .dk-bar i.fly, .dk-fill.fly { background: #ef4444; }
  .dk-bar i.meteor, .dk-bar i.charge, .dk-fill.meteor, .dk-fill.charge { background: #f59e0b; }
  .dk-set { display: inline-block; margin: 8px 0 0 6px; vertical-align: top; }
  .dk-set summary { list-style: none; display: inline-block; }
  .dk-set[open] { display: grid; gap: 8px; margin: 8px 0 0; max-width: 360px; }
  .dk-set label { display: grid; grid-template-columns: 70px 1fr; align-items: center; font-weight: 700; color: var(--msm-ink); }
  .dk-set select { font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--msm-field-line); background: var(--msm-field); color: var(--msm-ink); min-width: 0; }
  .dk-bot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 700; }
  .dk-bot input { width: 100px; font: 700 15px "Nunito", sans-serif; text-transform: uppercase; padding: 8px; border-radius: 8px; border: 1px solid var(--msm-field-line); background: var(--msm-field); color: var(--msm-ink); }
  .dk-status { margin: 10px 0 0; font-weight: 700; color: var(--msm-muted); }
  .dk-status b { color: var(--msm-ink); font-size: 20px; text-transform: capitalize; }
</style>
</head>
<body data-nav-active="darknell">
<script>document.body.dataset.theme = (function(){ try { return localStorage.getItem('msm_theme'); } catch (e) {} })() === 'light' ? 'light' : 'dark';</script>
<div id="site-nav"></div>

<main class="msm-page dk-grid">
  <section class="msm-panel">
    <h1 class="msm-section-title">Darknell Callouts</h1>
    <p class="msm-muted" style="margin:0 0 8px;font-size:13px">Tap the attack Darknell is doing right now. Callouts come ~1.5s early; Fly gets a 3-2-1 countdown. Tap again any time to resync. Keys: Space = next phase, Enter = next attack.</p>
    <p class="dk-status" id="status">Stopped.</p>
    <div class="dk-bot"><input id="botCode" maxlength="6" placeholder="Bot code" aria-label="Discord bot code"><button class="dk-btn" id="botGo" type="button">Connect</button> <span id="botState" class="msm-muted"></span></div>
    <div class="dk-bar"><i id="bar"></i></div>
    <button class="dk-btn dk-stop" id="stop" type="button">Stop</button>
    <details class="dk-set">
      <summary class="dk-btn">⚙️ Settings</summary>
      <label>Voice <select id="voice"><option value="">Default</option></select></label>
      <label>Speed <input id="rate" type="range" min="0.5" max="2" step="0.1"></label>
      <label>Pitch <input id="pitch" type="range" min="0" max="2" step="0.1"></label>
      <label>Volume <input id="volume" type="range" min="0" max="1" step="0.1"></label>
      <button class="dk-btn" id="test" type="button">Test</button>
    </details>
  </section>
  <div id="phases" class="dk-grid"></div>
</main>

<script src="../assets/js/site-nav.js"></script>
<script>
  // "attack seconds-until-next ...". Phase 0 runs once into phase 1; the others loop.
  let PHASES = [];
  const parse = lines => lines.map(s => s.match(/\w+ \d+/g).map(x => { const [name, d] = x.split(" "); return [name, +d]; }));
  fetch("../data/darknell.json").then(r => r.json()).then(lines => { PHASES = parse(lines); render(); });

  // Discord bot link: the page posts taps to the relay and Meccbot speaks them in voice.
  const RELAY = "https://darknell-relay.meccstorym-roster.workers.dev";
  let botCode = "", botOn = false;
  function send(msg) {
    if (!botCode) return;
    fetch(`${RELAY}/room/${botCode}`, { method: "POST", body: JSON.stringify(msg) })
      .then(r => r.json()).then(j => setBot(j.bots > 0)).catch(() => setBot(false));
  }
  function setBot(on) {
    botOn = on;
    $("botState").textContent = !botCode ? "" : on ? "🔊 Bot connected: it speaks for everyone." : "⚠️ Bot not found. Check the code from /audio darknell.";
  }
  function connect(code) {
    botCode = /^[A-Z0-9]{6}$/.test(code) ? code : ""; $("botCode").value = botCode;
    setBot(false); send({ t: "hello" });
  }
  const nx = ([p, i]) => p === 0 && i === PHASES[0].length - 1 ? [1, 0] : [p, (i + 1) % PHASES[p].length];
  const LEAD = 1.5, REACT = 1, BIG = ["fly", "meteor", "charge"];
  const cap = s => s[0].toUpperCase() + s.slice(1);

  let timers = [], cur = null;
  const $ = id => document.getElementById(id);

  function say(text) {
    speechSynthesis.cancel();
    if (botOn) return;
    const u = new SpeechSynthesisUtterance(text);
    u.voice = speechSynthesis.getVoices().find(v => v.voiceURI === cfg.voice) || null;
    u.rate = cfg.rate; u.pitch = cfg.pitch; u.volume = cfg.volume;
    speechSynthesis.speak(u);
  }
  // late = callout time already passed; countdown beats that are stale get dropped instead of all firing at once.
  const at = (t, fn, dropLate) => { if (!(dropLate && t < performance.now())) timers.push(setTimeout(fn, t - performance.now())); };
  function clear() { timers.forEach(clearTimeout); timers = []; speechSynthesis.cancel(); }

  function stop() { send({ t: "stop" }); clear(); cur = null; $("bar").getAnimations().forEach(a => a.cancel()); render(); $("status").textContent = "Stopped."; }

  // Attack i of phase p lands at time t: show it and schedule the callouts for the next one.
  function land(p, i, t) {
    const [np, n] = nx([p, i]), nn = nx([np, n]);
    const name = PHASES[np][n][0], after = PHASES[nn[0]][nn[1]][0];
    const tn = t + PHASES[p][i][1] * 1000; // chain from scheduled times so delays don't drift
    cur = [p, i]; render();
    $("status").innerHTML = `Now: ${cap(PHASES[p][i][0])} · Next: <b>${cap(name)}</b> in ${PHASES[p][i][1]}s`;
    const bar = $("bar"), len = PHASES[p][i][1] * 1000;
    bar.className = name; bar.getAnimations().forEach(a => a.cancel());
    const fill = document.createElement("i"), anim = { duration: len, delay: tn - len - performance.now(), fill: "forwards" };
    fill.className = "dk-fill " + name;
    document.querySelector(".dk-btn.next")?.prepend(fill);
    [bar, fill].forEach(el => el.animate([{ width: "0%" }, { width: "100%" }], anim));
    if (name === "fly") {
      at(tn - 3000, () => say("Fly in 3"), true); at(tn - 2000, () => say("2"), true); at(tn - 1000, () => say("1"), true);
    } else {
      at(tn - LEAD * 1000, () => say(cap(name) + (BIG.includes(after) ? " then " + cap(after) + (after === "fly" ? " in " + Math.floor(LEAD + PHASES[np][n][1]) : after === "charge" ? ", face him left" : "") : "")));
    }
    at(tn, () => { if (name === "fly") say("Fly"); land(np, n, tn); });
  }

  function render() {
    $("phases").innerHTML = PHASES.map((list, p) => `<section class="msm-panel dk-phase"><b>P${p}</b><div class="dk-attacks">` +
      list.map(([name], i) => {
        const now = cur && cur[0] === p && cur[1] === i, next = cur && String(nx(cur)) === String([p, i]);
        return `<button class="dk-btn${now ? " now" : ""}${next ? " next" : ""}" type="button" data-p="${p}" data-i="${i}">${name}</button>`;
      }).join("") + `</div></section>`).join("");
  }

  $("phases").addEventListener("pointerdown", e => {
    const b = e.target.closest("[data-i]"); if (!b) return;
    clear(); land(+b.dataset.p, +b.dataset.i, performance.now() - REACT * 1000); send({ t: "land", p: +b.dataset.p, i: +b.dataset.i, ago: REACT * 1000 }); // tap lands a beat after the attack started
  });
  $("stop").addEventListener("click", stop);
  // Space: next phase starts now. Enter: the next attack starts now.
  document.addEventListener("keydown", e => {
    if (!PHASES.length || e.target.closest?.("select, input") || (e.key !== " " && e.key !== "Enter")) return;
    e.preventDefault();
    if (e.key === " ") { const p = cur ? (cur[0] % 4) + 1 : 0; clear(); land(p, 0, performance.now()); send({ t: "land", p, i: 0, ago: 0 }); return; }
    if (!cur) return;
    const [p, i] = nx(cur);
    clear(); land(p, i, performance.now()); send({ t: "land", p, i, ago: 0 });
  });
  $("botGo").addEventListener("click", () => connect($("botCode").value.trim().toUpperCase()));
  if (location.hash.length > 1) connect(location.hash.slice(1).toUpperCase());

  const KEY = "msm_darknell_voice";
  const cfg = Object.assign({ voice: "", rate: 1.2, pitch: 1, volume: 1 }, (() => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) {} })());
  function fillVoices() {
    $("voice").innerHTML = '<option value="">Default</option>' + speechSynthesis.getVoices()
      .map(v => `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join("");
    $("voice").value = cfg.voice;
  }
  fillVoices(); speechSynthesis.addEventListener("voiceschanged", fillVoices);
  ["voice", "rate", "pitch", "volume"].forEach(k => {
    if (k !== "voice") $(k).value = cfg[k];
    $(k).addEventListener("input", () => {
      cfg[k] = k === "voice" ? $(k).value : +$(k).value;
      try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
    });
  });
  $("test").addEventListener("click", () => say("Fly in 3"));
</script>
</body>
</html>
